name: Commercial WhatsApp Bot Tests
on:
  pull_request:
    paths:
      - "commercial-bot/**"
      - ".github/workflows/commercial-bot-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install bot dependencies
        run: npm install --prefix commercial-bot
      - name: Run deterministic flow tests
        run: npm test --prefix commercial-bot
